<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b2b"><title>CASEFILE · Alpha 0.2</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e8f1fa;background:#09111c}*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid #79c4ff;outline-offset:2px}.shell{max-width:1120px;margin:auto;min-height:100vh;background:#101b2b}.top{background:#17283c;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-size:24px;font-weight:850;letter-spacing:.09em}.sub{font-size:11px;color:#9ab3cc;letter-spacing:.08em}.badge,.pill{display:inline-block;background:#55431f;color:#ffda8a;padding:6px 10px;border-radius:99px;font-size:11px;font-weight:700}.pill{background:#263e56;color:#b9d8ef}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 80px)}nav{background:#111f30;padding:14px;display:flex;flex-direction:column;gap:7px}nav button{border:0;text-align:left;background:transparent;color:#bed0e1;padding:13px 12px;border-radius:9px}nav button.active,nav button:hover{background:#294964;color:white}main{padding:24px;max-width:870px;width:100%}h1{margin:5px 0;font-size:clamp(24px,4vw,34px)}h2{margin:2px 0 17px;font-size:23px}h3{margin:2px 0 9px}.muted{color:#a1b7cc}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;color:#90bada;text-transform:uppercase}.card{border:1px solid #35485e;border-radius:12px;background:#1c2d40;padding:17px;margin:13px 0;line-height:1.55}.card p{margin:8px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:16px;background:#1c2d40;border-radius:10px;text-align:center}.stat strong{font-size:23px;display:block}.stat span{font-size:12px;color:#9fb5c9}.btn{border:1px solid #56718d;border-radius:9px;background:#293f56;color:#f0f6fd;padding:11px 15px;font-weight:650;min-height:44px}.btn.primary{background:#2478ba;border-color:#3296dc}.btn:hover{filter:brightness(1.17)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.small{padding:8px 12px;min-height:36px;font-size:13px}.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.line{border-top:1px solid #385066;margin:15px 0}.choice{display:block;border:1px solid #46617b;padding:13px;border-radius:9px;margin:8px 0;cursor:pointer}.choice:has(input:checked){background:#294964;border-color:#77bce7}.choice input{margin-right:10px;accent-color:#55aaff}.statement{padding:13px;background:#2b4157;border-left:3px solid #7eb7de;border-radius:7px;margin:9px 0}.good{color:#84dfad}.warn{color:#ffcf7e}.small{font-size:13px}.footer{margin-top:24px;font-size:12px;color:#9cb1c4}textarea{width:100%;min-height:190px;resize:vertical;background:#101c2c;border:1px solid #56718d;border-radius:10px;color:#e8f1fa;padding:14px}select{background:#101c2c;color:#e8f1fa;border:1px solid #56718d;border-radius:8px;padding:12px;max-width:100%;width:100%}.timeline{border-left:2px solid #5686a8;margin:16px 0 16px 12px;padding-left:20px}.event{position:relative;margin:0 0 15px}.event:before{content:'';position:absolute;left:-27px;top:7px;width:11px;height:11px;border-radius:50%;background:#76bce8}.event strong{color:#91c9f0}.tag{font-size:11px;color:#a8c9e5;background:#2c455e;border-radius:5px;padding:3px 6px;margin-left:7px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.feedback{padding:13px;background:#263f53;border-radius:8px;margin-top:12px}.titleRow{display:flex;align-items:center;justify-content:space-between;gap:12px}.titleRow h3{margin:0}.check{display:block;padding:8px 0}.check input{margin-right:8px;accent-color:#6ab6ef}@media(max-width:700px){.layout{display:block}nav{flex-direction:row;overflow-x:auto;position:sticky;top:0;z-index:4;padding:8px;gap:3px}nav button{white-space:nowrap;padding:11px 9px;font-size:12px}main{padding:17px}.top{padding:13px}.logo{font-size:20px}.sub{font-size:9px}.grid,.split{grid-template-columns:1fr}.stats{gap:6px}.stat{padding:11px 4px}.stat span{font-size:10px}.badge{font-size:9px}.card{padding:14px}}
</style></head><body><div class="shell"><header class="top"><div><div class="logo">⬡ CASEFILE</div><div class="sub">KRIMINALPOLIZEI · ERMITTLUNGSSYSTEM</div></div><span class="badge">ALPHA 0.2</span></header><div class="layout"><nav id="nav"></nav><main id="screen" aria-live="polite"></main></div></div><script>
'use strict';
const KEY='casefile-alpha02-v1',OLD='casefile-alpha01-v1';
const cases={
 c1:{name:'Der letzte Anruf',number:'BE-2026-001',date:'24. Oktober 2026',location:'Frutigen, Kanton Bern',intro:'Daniel Keller (38) wird tot in seiner Wohnung aufgefunden. Drei Personen geraten in den Fokus.',report:'Am 24. Oktober um 22:06 Uhr meldete Nina Roth, dass Daniel Keller nicht auf Klopfen reagierte. Die Polizei fand ihn tot in seiner Wohnung. Keine Einbruchsspuren; ein Stuhl war umgestossen. Ein schwerer Briefbeschwerer wurde sichergestellt.',people:[{id:'mara',name:'Mara Keller',role:'Ehefrau · 34',description:'Behauptet, den Abend bei ihrer Schwester verbracht zu haben.',questions:[['Wo waren Sie um 21:15 Uhr?','Bei meiner Schwester in Spiez, den ganzen Abend.'],['Gab es Streit?','Wegen der Trennung, ja. Aber ich wollte mich aussprechen.'],['Haben Sie Daniel angerufen?','Nein, seit dem Nachmittag hatten wir keinen Kontakt.']],challenges:[['call','Telefonprotokoll vorhalten','Ja, ich habe ihn angerufen. Ich hatte Angst, dass es verdächtig klingt.'],['cell','Standortdaten vorhalten','Ich war in der Nähe der Wohnung, aber nur kurz.'] ]},{id:'lukas',name:'Lukas Steiner',role:'Geschäftspartner · 41',description:'Daniel schuldete ihm CHF 48’000.',questions:[['Wann sahen Sie Daniel zuletzt?','Gegen 18 Uhr.'],['Warum gab es Streit?','Wegen seiner Schulden.'],['Wo waren Sie später?','Im Büro. Meine Karte wurde registriert.']],challenges:[['badge','Zutrittsprotokoll vorhalten','Meine Karte wurde um 20:52 Uhr benutzt. Das sagt aber nicht, ob ich das Büro verlassen habe.']]},{id:'nina',name:'Nina Roth',role:'Nachbarin · 29',description:'Hörte einen Streit und alarmierte die Polizei.',questions:[['Was hörten Sie?','Gegen 21:15 Uhr einen Streit.'],['Wen sahen Sie?','Eine Person mit dunkler Jacke um 21:24 Uhr.'],['Wann riefen Sie die Polizei?','Um 22:06 Uhr.']],challenges:[]}],clues:[['autopsy','Gerichtsmedizin','Gutachten','Todeszeit zwischen 21:00 und 21:30 Uhr, stumpfe Gewalteinwirkung.'],['call','Telefonprotokoll','Digital','Daniel nahm um 21:12 Uhr einen Anruf von Mara entgegen. Dauer: 48 Sekunden.'],['camera','Überwachungskamera','Video','21:24 Uhr: Eine Person mit dunkler Jacke verlässt das Haus; keine Identifikation möglich.'],['cell','Funkzellenauswertung','Digital','Maras Handy war um 21:18 Uhr in einer Funkzelle nahe dem Tatort. Kein genauer Standortnachweis.'],['bank','Bankunterlagen','Finanzen','Daniel schuldete Lukas CHF 48’000.'],['badge','Büro-Zutrittsprotokoll','Digital','Lukas’ Badge wurde um 20:52 und 23:08 Uhr benutzt. Kein Nachweis für ununterbrochene Anwesenheit.'],['sister','Aussage der Schwester','Zeugin','Mara traf erst um 21:48 Uhr in Spiez ein.'],['lab','Laborbericht Briefbeschwerer','Forensik','Daniels Blut und Maras Fingerabdruck auf dem Briefbeschwerer; Zeitpunkt der Berührung unklar.']],timeline:[['20:52','Lukas’ Badge registriert','badge'],['21:00–21:30','Geschätzte Todeszeit','autopsy'],['21:12','Anruf Mara → Daniel','call'],['21:18','Maras Telefon in Tatort-Funkzelle','cell'],['21:24','Unbekannte Person verlässt das Haus','camera'],['21:48','Mara bei Schwester eingetroffen','sister'],['22:06','Notruf Nina','']],combos:[{a:'call',b:'sister',id:'c1time',title:'Maras Alibi bricht zusammen',text:'Ihr angeblich ganzer Abend in Spiez ist mit Anruf und bestätigter Ankunft um 21:48 Uhr unvereinbar.'},{a:'cell',b:'lab',id:'c1trace',title:'Anwesenheit und Tatmittel',text:'Die Funkzelle allein ist ungenau; zusammen mit der Spur am Tatmittel ergibt sich ein belastender Zusammenhang, aber noch kein isolierter Tatnachweis.'}],motives:[['relationship','Trennung und Beziehungskonflikt'],['money','Geschäftsschulden'],['neighbor','Nachbarschaftsstreit']],proofs:[['lab','Laborbericht Briefbeschwerer'],['bank','Bankunterlagen'],['camera','Überwachungskamera']],solution:{person:'mara',motive:'relationship',proof:'lab'},ending:'Mara suchte Daniel trotz ihrer Behauptung auf. Der Streit über die Trennung eskalierte; sie schlug mit dem Briefbeschwerer zu. Danach fuhr sie zu ihrer Schwester. Das Telefonprotokoll, die verspätete Ankunft und die Spuren am Tatmittel ergeben zusammen die Auflösung dieser fiktiven Geschichte.'},
 c2:{name:'Sturz aus der Sektion',number:'BE-2026-002',date:'25. Oktober 2026',location:'Altstadt Bern',intro:'Arthur Berger (62) wird unter dem Bürofenster seines Uhren- und Antiquitätengeschäfts «Chronos & Werte» tot gefunden. Ein Unfall scheint ausgeschlossen.',report:'Um 22:02 Uhr wird Arthur Berger leblos im Hinterhof entdeckt. Das Bürofenster im ersten Stock wurde innen am Sicherungsstift manipuliert. Die Spurensicherung vermutet, dass der Täter Arthur aus dem Fenster stiess und danach das Fenster präparierte, um einen Reinigungsunfall vorzutäuschen. Keine Einbruchsspuren. Todeszeit laut Rechtsmedizin ungefähr 21:30 Uhr.',people:[{id:'julian',name:'Julian Berger',role:'Sohn und Geschäftspartner · 34',description:'Schulden, Streit über die Ausrichtung des Geschäfts; behauptet, online gespielt zu haben.',questions:[['Wo waren Sie um 21:30 Uhr?','Zuhause. Ich habe durchgehend online gespielt.'],['Hatten Sie Kontakt mit Ihrem Vater?','Nein. Seit dem Nachmittag nicht mehr.'],['Wie steht es um Ihre Finanzen?','Nicht gut, aber mein Vater wollte helfen.']],challenges:[['phone','Anrufprotokoll vorhalten','Gut, er hat mich um 21:15 Uhr angerufen. Ich wollte keinen Ärger und habe es verschwiegen.'],['game','Gaming-Protokoll vorhalten','Die Verbindung war kurz weg. Das heisst nicht, dass ich fort war.'],['combo_jacket','Jacke und Video vorhalten','... Die Jacke gehört mir. Ich war dort, aber ich wollte nur reden. Er lebte noch, als ich ging.']]},{id:'elena',name:'Elena Rostova',role:'Uhrmacherin · 29',description:'Streit über Kassenbons, besitzt Werkzeug mit Gravur E.R.',questions:[['Wann verliessen Sie das Geschäft?','Um 21 Uhr.'],['Wieso gab es Streit?','Arthur dachte, ich hätte Belege falsch abgelegt.'],['Ist das Ihre Zange?','Ja. Sie lag in der Werkstatt. Jeder konnte sie nehmen.']],challenges:[['pliers','Zange vorhalten','Das ist meine. Sie fehlte seit gestern aus der offenen Werkzeugschublade.']]},{id:'marcel',name:'Marcel «Max» Gerber',role:'Antiquitätenhändler · 45',description:'Konkurrent; wollte eine goldene Taschenuhr kaufen.',questions:[['Wo waren Sie zur Tatzeit?','Die ganze Nacht in der Bar am anderen Ende der Stadt.'],['Wollten Sie Arthurs Uhr?','Ja, aber er wollte sie nicht verkaufen.'],['Waren Sie beim Geschäft?','Nein, warum sollte ich?']],challenges:[['receipt','Tankstellenbon vorhalten','Okay, ich war in der Nähe. Ich wollte Arthur noch wegen der Uhr treffen, habe mich aber nicht hineingetraut.']] }],clues:[['scene','Tatortbericht','Polizeibericht','Das Fenster wurde von innen mit Werkzeug manipuliert. Keine Einbruchsspuren. Todeszeit ca. 21:30 Uhr.'],['phone','Opfer-Smartphone','Digital','Letzter ausgehender Anruf 21:15 Uhr an Julian. Ungesendeter Entwurf an den Anwalt: «Julian, ich weiss von den gefälschten Rechnungen. Morgen reden wir.»'],['receipt','Tankstellenbon','Beleg','Marcel tankte um 21:25 Uhr nur 500 Meter vom Geschäft entfernt. Sein Bar-Alibi ist falsch.'],['pliers','Gravierte Zange','Forensik','Im Gebüsch unter dem Fenster liegt eine Zange mit E.R.-Gravur. Passend zum manipulierten Sicherungsstift. Sie stammt aus der allgemein zugänglichen Werkstatt.'],['note','Zerrissener Zettel','Dokument','In Julians Jackentasche: Tresorcode und «Bevor er das Testament ändert». Der Zettel belegt ein mögliches Motiv, keine Tat.'],['camera','Café-Kamera','Video','Um 21:28 Uhr rennt eine Person in rotem Kapuzenpulli aus dem Hinterhof. Auf dem linken Ärmel ist ein auffälliger heller, dreieckiger Flicken sichtbar. Gesicht nicht erkennbar.'],['game','Gaming-Sitzungsprotokoll','Digital','Julians Konto war um 20:55 Uhr aktiv. Verbindung 21:09 Uhr getrennt, erneute Anmeldung erst 21:51 Uhr. Online-Status allein beweist keine Anwesenheit.'],['jacket','Sichergestellter Kapuzenpulli','Forensik','Julian übergab freiwillig seinen roten Pullover. Links ein heller dreieckiger Reparaturflicken mit zwei schwarzen Nähten. Im Ärmel wurde ein winziger Glassplitter sichergestellt; Laborvergleich mit dem Bürofenster stimmt überein.']],timeline:[['20:55','Julians Gaming-Konto online','game'],['21:00','Elena gibt Feierabend an',''],['21:09','Gaming-Verbindung getrennt','game'],['21:15','Arthur ruft Julian an','phone'],['21:25','Marcel an Tankstelle','receipt'],['21:28','Person mit rotem Pullover flieht','camera'],['ca. 21:30','Geschätzte Todeszeit (mit Unsicherheit)','scene'],['21:51','Gaming-Konto wieder online','game'],['22:02','Arthur wird gefunden','']],combos:[{a:'camera',b:'jacket',id:'combo_jacket',title:'Identifizierbarer Ärmel',text:'Der einzigartige Reparaturflicken des sichergestellten Pullovers stimmt mit dem Kamerabild überein. Der Glassplitter am Ärmel passt zum beschädigten Bürofenster. Julian war zur relevanten Zeit am Tatort.'},{a:'game',b:'phone',id:'combo_gap',title:'Alibi-Lücke bestätigt',text:'Julians durchgehendes Online-Alibi ist falsch: Zwischen 21:09 und 21:51 Uhr bestand keine Verbindung. Arthurs Anruf um 21:15 Uhr fällt in diese Lücke.'},{a:'pliers',b:'scene',id:'combo_tool',title:'Werkzeugherkunft unklar',text:'Die Zange passt zum Fenster, war aber in einer offenen Werkstatt zugänglich. Die Gravur allein belastet Elena nicht eindeutig.'},{a:'note',b:'phone',id:'combo_motive',title:'Druck auf Julian',text:'Der Entwurf über gefälschte Rechnungen und die Notiz zur Testamentsänderung ergeben ein konkretes finanzielles Motiv.'}],motives:[['fraud','Entdeckung gefälschter Rechnungen und drohender Erbverlust'],['watch','Streit um die goldene Taschenuhr'],['receipts','Konflikt wegen Kassenbons']],proofs:[['combo_jacket','Kombination: Café-Kamera + Julians Pullover'],['pliers','Zange mit E.R.-Gravur'],['receipt','Tankstellenbon']],solution:{person:'julian',motive:'fraud',proof:'combo_jacket'},ending:'Julian wurde wegen der gefälschten Rechnungen zur Rede gestellt und fürchtete um sein Erbe. Er suchte seinen Vater im Büro auf; der Streit eskalierte, und er stiess Arthur aus dem Fenster. Er manipulierte das Fenster mit einer Zange aus der offenen Werkstatt und liess sie zurück, um Elena zu belasten. Die Kamera zeigt den einzigartigen Flicken an Julians Pullover, und ein Glassplitter am Ärmel passt zum Bürofenster. Die Gaming-Unterbrechung widerlegt sein Alibi. Marcel war zwar in der Nähe und log, doch das macht ihn nicht zum Täter. (Fiktive Fallauflösung; Indizien werden gemeinsam bewertet.)'}
};
const sections=[['cases','⌂ Fallauswahl'],['home','▤ Übersicht'],['file','▣ Fallakte'],['evidence','◈ Beweise'],['people','♙ Personen'],['interview','☷ Verhöre'],['timeline','◷ Zeitstrahl'],['lab','⚗ Labor'],['notes','✎ Notizen'],['solve','⚖ Abschluss']];
const fresh=()=>({section:'home',seen:[],answers:{},flags:[],person:'',notes:'',choice:{},finished:false,result:null,started:Date.now(),combos:[]});
let db={active:'c1',cases:{c1:fresh(),c2:fresh()}};
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&v.cases){db={...db,...v,cases:{c1:{...fresh(),...v.cases.c1},c2:{...fresh(),...v.cases.c2}}}}else{const old=JSON.parse(localStorage.getItem(OLD)||'null');if(old){db.cases.c1={...fresh(),...old,combos:[]};db.cases.c1.section='home'}}}catch(e){}
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const C=()=>cases[db.active],S=()=>db.cases[db.active];function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}function go(page){S().section=page;save();render();scrollTo(0,0)}function selectCase(id){db.active=id;save();go('home')}
function render(){const s=S();$('nav').innerHTML=sections.map(([id,name])=>`<button class="${s.section===id?'active':''}" data-nav="${id}">${name}</button>`).join('');const pages={cases:caseList,home,file,evidence,people,interview,timeline,lab,notes,solve};$('screen').innerHTML=pages[s.section]?.()||caseList();wire()}
function caseList(){return `<div class="eyebrow">Ermittlungszentrale</div><h1>Fallauswahl</h1><p class="muted">Wähle einen Fall. Fortschritt wird für jeden Fall getrennt gespeichert.</p><div class="grid">${Object.entries(cases).map(([id,c],i)=>{const s=db.cases[id];return `<div class="card"><span class="eyebrow">Fall 0${i+1} · ${esc(c.number)}</span><h3>${esc(c.name)}</h3><p>${esc(c.intro)}</p><span class="pill">${s.finished?'Abgeschlossen':s.seen.length||Object.keys(s.answers).length?'In Bearbeitung':'Noch nicht begonnen'}</span><p class="muted small">${s.seen.length}/${c.clues.length} Beweise geprüft</p><button class="btn primary" data-selectcase="${id}">${s.finished?'Fall ansehen':s.seen.length?'Fortsetzen':'Fall beginnen'} →</button></div>`}).join('')}</div><div class="footer">Deine Daten werden nur in diesem Browser gespeichert, nicht zwischen Geräten synchronisiert.</div>`}
function home(){const c=C(),s=S();return `<div class="eyebrow">Aktive Ermittlung · ${esc(c.number)}</div><h1>${esc(c.name)}</h1><p class="muted">${esc(c.location)} · ${esc(c.date)}</p><div class="card"><div class="titleRow"><h3>Ermittlungsbericht</h3><span class="pill">${s.finished?'Abgeschlossen':'Ungelöst'}</span></div><p>${esc(c.intro)}</p><p>Untersuche die Spuren, führe Verhöre, prüfe Alibis im Zeitstrahl und kombiniere Beweise im Labor.</p></div><div class="stats"><div class="stat"><strong>${c.people.length}</strong><span>Personen</span></div><div class="stat"><strong>${s.seen.length}/${c.clues.length}</strong><span>Beweise</span></div><div class="stat"><strong>${s.combos.length}</strong><span>Verbindungen</span></div></div><div class="btnrow"><button class="btn primary" data-go="file">Ermittlung beginnen →</button><button class="btn" data-go="cases">Alle Fälle</button></div>`}
function file(){return `<div class="eyebrow">Fallakte ${esc(C().number)}</div><h2>Polizeirapport</h2><div class="card"><h3>${esc(C().name)}</h3><p>${esc(C().report)}</p><div class="line"></div><h3>Ermittlungsauftrag</h3><p>Rekonstruiere die Ereignisse. Eine falsche Aussage ist noch kein Mordbeweis. Kombiniere unabhängige Spuren.</p></div><button class="btn primary" data-go="evidence">Beweise untersuchen →</button>`}
function evidence(){const s=S();return `<div class="eyebrow">Asservatenkammer</div><h2>Beweise <span class="pill">${s.seen.length}/${C().clues.length} geprüft</span></h2>${C().clues.map(([id,title,kind,body],i)=>`<div class="card"><span class="eyebrow">${esc(kind)} · B-${String(i+1).padStart(3,'0')}</span><h3>${esc(title)} ${s.seen.includes(id)?'<span class="good">✓</span>':''}</h3>${s.seen.includes(id)?`<p>${esc(body)}</p>`:''}<button class="btn small" data-clue="${id}">${s.seen.includes(id)?'Erneut ansehen':'Beweis untersuchen'}</button></div>`).join('')}`}
function people(){return `<div class="eyebrow">Personenregister</div><h2>Beteiligte Personen</h2><div class="grid">${C().people.map(p=>`<div class="card"><div class="eyebrow">${esc(p.role)}</div><h3>♙ ${esc(p.name)}</h3><p>${esc(p.description)}</p><button class="btn small" data-person="${p.id}">Person befragen →</button></div>`).join('')}</div>`}
function interview(){const s=S(),p=C().people.find(p=>p.id===s.person)||C().people[0];return `<div class="eyebrow">Befragung · Protokoll</div><h2>Verhörraum</h2><div class="btnrow">${C().people.map(x=>`<button class="btn small ${p.id===x.id?'primary':''}" data-person="${x.id}">${esc(x.name)}</button>`).join('')}</div><div class="card"><h3>♙ ${esc(p.name)}</h3><p class="muted small">${esc(p.role)}</p><div class="line"></div>${p.questions.map(([q,a],i)=>`<div style="margin-bottom:12px"><button class="btn small" data-question="${i}">${esc(q)}</button>${(s.answers[p.id]||[]).includes(i)?`<div class="statement">«${esc(a)}»</div>`:''}</div>`).join('')}${p.challenges.map(([req,title,answer])=>{const allowed=s.seen.includes(req)||s.combos.includes(req);return `<div class="line"></div><button class="btn small ${allowed?'primary':''}" data-challenge="${req}" ${!allowed?'disabled':''}>⚑ ${esc(title)} ${allowed?'':'(Hinweis fehlt)'}</button>${s.flags.includes(p.id+':'+req)?`<div class="statement">«${esc(answer)}»</div>`:''}`}).join('')}</div><p class="muted small">Untersuchte Beweise und Laborerkenntnisse schalten zusätzliche Fragen frei.</p>`}
function timeline(){const c=C(),s=S();return `<div class="eyebrow">Alibi- & Zeitstrahl-Tool</div><h2>Chronologie</h2><p class="muted">Zeitpunkte aus Beweisen werden erst sichtbar, wenn du die jeweilige Spur untersucht hast. Angaben ohne Spur stammen aus dem Polizeirapport.</p><div class="card"><div class="timeline">${c.timeline.filter(e=>!e[2]||s.seen.includes(e[2])).map(([time,desc,id])=>`<div class="event"><strong>${esc(time)}</strong><span class="tag">${id?'Spur':'Rapport'}</span><div>${esc(desc)}</div></div>`).join('')}</div></div><h3>Alibis vergleichen</h3>${c.people.map(p=>`<div class="card"><strong>${esc(p.name)}</strong><p>${esc(p.questions[0][1])}</p><button class="btn small" data-person="${p.id}">Aussage überprüfen →</button></div>`).join('')}`}
function lab(){const c=C(),s=S(),available=c.clues.filter(x=>s.seen.includes(x[0]));return `<div class="eyebrow">Spurenlabor · Verbindung</div><h2>Beweise kombinieren</h2><p class="muted">Wähle zwei bereits untersuchte Beweise. Nur sinnvolle Kombinationen ergeben eine neue Erkenntnis.</p><div class="card"><div class="split"><label>Erster Beweis<select id="labA"><option value="">Auswählen …</option>${available.map(x=>`<option value="${x[0]}">${esc(x[1])}</option>`).join('')}</select></label><label>Zweiter Beweis<select id="labB"><option value="">Auswählen …</option>${available.map(x=>`<option value="${x[0]}">${esc(x[1])}</option>`).join('')}</select></label></div><div class="btnrow"><button class="btn primary" id="combine" ${available.length<2?'disabled':''}>Spuren verknüpfen</button></div><div id="labResult" aria-live="polite"></div></div><h3>Entdeckte Verbindungen <span class="pill">${s.combos.length}/${c.combos.length}</span></h3>${s.combos.length?c.combos.filter(x=>s.combos.includes(x.id)).map(x=>`<div class="card"><h3 class="good">✓ ${esc(x.title)}</h3><p>${esc(x.text)}</p></div>`).join(''):'<p class="muted">Noch keine Kombination entdeckt.</p>'}`}
function notes(){return `<div class="eyebrow">Persönliches Notizbuch</div><h2>Ermittlungsnotizen</h2><p class="muted">Für diesen Fall separat gespeichert.</p><textarea id="notes" placeholder="Zeitlücken, Theorien, Verdächtige …">${esc(S().notes)}</textarea><p class="good small">Automatisches Speichern aktiviert.</p>`}
function opt(field,val,label){return `<label class="choice"><input type="radio" name="${field}" value="${esc(val)}" ${S().choice[field]===val?'checked':''}>${esc(label)}</label>`}
function solve(){const c=C(),s=S();if(s.finished){const r=s.result||{};return `<div class="eyebrow">Abschlussbericht · ${esc(c.number)}</div><h2>Fall abgeschlossen</h2><div class="card"><h3 class="${r.correct?'good':'warn'}">${r.correct?'✓ Fall gelöst':'✕ Nicht vollständig richtig'}</h3><p>${r.correct?'Du hast Täter, Motiv und entscheidenden Beweis richtig bestimmt.':'Deine Schlussfolgerung stimmt nicht vollständig mit der Fallauflösung überein.'}</p><div class="line"></div><h3>Auflösung · Spoiler</h3><p>${esc(c.ending)}</p><div class="feedback"><strong>Deine Auswahl:</strong><br>${esc(r.person||'–')} · ${esc(r.motive||'–')} · ${esc(r.proof||'–')}</div></div><button class="btn" id="reset">↻ Diesen Fall neu starten</button><button class="btn" data-go="cases">Zur Fallauswahl</button>`}
return `<div class="eyebrow">Abschlussbericht · ${esc(c.number)}</div><h2>Ermittlung abschliessen</h2><p class="muted">Du kannst jederzeit abschliessen. Nach der Abgabe wird die Lösung enthüllt.</p><div class="card"><h3>1. Wer ist verantwortlich?</h3>${c.people.map(p=>opt('person',p.id,p.name)).join('')}<div class="line"></div><h3>2. Was war das Motiv?</h3>${c.motives.map(x=>opt('motive',...x)).join('')}<div class="line"></div><h3>3. Welcher Beweis ist entscheidend?</h3>${c.proofs.map(([id,label])=>opt('proof',id,label+(id.startsWith('combo_')&&!s.combos.includes(id)?' · im Labor noch nicht entdeckt':''))).join('')}<button class="btn primary" id="finish" ${['person','motive','proof'].every(k=>s.choice[k])?'':'disabled'}>Abschlussbericht einreichen</button></div>`}
function wire(){document.querySelectorAll('[data-nav],[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.nav||b.dataset.go));document.querySelectorAll('[data-selectcase]').forEach(b=>b.onclick=()=>selectCase(b.dataset.selectcase));document.querySelectorAll('[data-clue]').forEach(b=>b.onclick=()=>{const s=S();if(!s.seen.includes(b.dataset.clue))s.seen.push(b.dataset.clue);save();render()});document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{S().person=b.dataset.person;go('interview')});document.querySelectorAll('[data-question]').forEach(b=>b.onclick=()=>{const s=S(),v=s.answers[s.person]||[],q=Number(b.dataset.question);if(!v.includes(q))v.push(q);s.answers[s.person]=v;save();render()});document.querySelectorAll('[data-challenge]').forEach(b=>b.onclick=()=>{const s=S(),k=s.person+':'+b.dataset.challenge;if(!s.flags.includes(k))s.flags.push(k);save();render()});if($('notes'))$('notes').oninput=e=>{S().notes=e.target.value;save()};if($('combine'))$('combine').onclick=()=>{const a=$('labA').value,b=$('labB').value,el=$('labResult');if(!a||!b||a===b){el.innerHTML='<div class="feedback warn">Wähle zwei verschiedene Beweise.</div>';return}const match=C().combos.find(x=>[x.a,x.b].includes(a)&&[x.a,x.b].includes(b));if(!match){el.innerHTML='<div class="feedback">Keine neue Erkenntnis aus dieser Kombination.</div>';return}if(!S().combos.includes(match.id))S().combos.push(match.id);save();render();$('labResult').innerHTML=`<div class="feedback good">✓ Neue Erkenntnis: ${esc(match.title)}</div>`};document.querySelectorAll('input[type=radio]').forEach(e=>e.onchange=()=>{S().choice[e.name]=e.value;save();if($('finish'))$('finish').disabled=!['person','motive','proof'].every(k=>S().choice[k])});if($('finish'))$('finish').onclick=()=>{const s=S(),c=C();if(!['person','motive','proof'].every(k=>s.choice[k]))return;const labels={person:Object.fromEntries(c.people.map(p=>[p.id,p.name])),motive:Object.fromEntries(c.motives),proof:Object.fromEntries(c.proofs)};s.result={correct:Object.keys(c.solution).every(k=>s.choice[k]===c.solution[k])&&(!c.solution.proof.startsWith('combo_')||s.combos.includes(c.solution.proof)),...Object.fromEntries(['person','motive','proof'].map(k=>[k,labels[k][s.choice[k]]||s.choice[k]]))};s.finished=true;save();render();scrollTo(0,0)};if($('reset'))$('reset').onclick=()=>{if(confirm('Nur diesen Fall zurücksetzen?')){db.cases[db.active]=fresh();save();go('home')}}}
render();
</script></body></html>
