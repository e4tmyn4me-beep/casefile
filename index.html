<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101b2b"><title>CASEFILE – Der letzte Anruf</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e8f1fa;background:#09111c}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid #79c4ff;outline-offset:2px}.shell{max-width:1100px;margin:auto;min-height:100vh;background:#101b2b}.top{background:#17283c;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-size:24px;font-weight:850;letter-spacing:.1em}.sub{font-size:11px;color:#9ab3cc;letter-spacing:.08em}.badge{background:#55431f;color:#ffda8a;padding:6px 10px;border-radius:99px;font-size:11px;font-weight:700}.layout{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 80px)}nav{background:#111f30;padding:14px;display:flex;flex-direction:column;gap:7px}nav button{border:0;text-align:left;background:transparent;color:#bed0e1;padding:13px 12px;border-radius:9px}nav button.active,nav button:hover{background:#294964;color:white}main{padding:24px;max-width:850px;width:100%}h1{margin:5px 0;font-size:clamp(24px,4vw,34px)}h2{margin:2px 0 17px;font-size:23px}h3{margin:2px 0 9px}.muted{color:#a1b7cc}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;color:#90bada;text-transform:uppercase}.card{border:1px solid #35485e;border-radius:12px;background:#1c2d40;padding:17px;margin:13px 0;line-height:1.55}.card p{margin:8px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:16px;background:#1c2d40;border-radius:10px;text-align:center}.stat strong{font-size:23px;display:block}.stat span{font-size:12px;color:#9fb5c9}.btn{border:1px solid #56718d;border-radius:9px;background:#293f56;color:#f0f6fd;padding:11px 15px;font-weight:650;min-height:44px}.btn.primary{background:#2478ba;border-color:#3296dc}.btn:hover{filter:brightness(1.17)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.small{padding:8px 12px;min-height:36px;font-size:13px}.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.line{border-top:1px solid #385066;margin:15px 0}.choice{display:block;border:1px solid #46617b;padding:13px;border-radius:9px;margin:8px 0;cursor:pointer}.choice:has(input:checked){border-color:#5cb1ed;background:#224763}.choice input{margin-right:9px}.pill{font-size:11px;color:#c4deef;background:#304a63;padding:5px 9px;border-radius:20px;display:inline-block}.good{color:#91ddb4}.warning{color:#ffc977}.statement{background:#304a60;border-left:3px solid #7db9e5;padding:13px;border-radius:6px;margin:10px 0}.small{font-size:13px}textarea{width:100%;min-height:170px;background:#0d1a2a;color:#f1f6ff;border:1px solid #60758a;border-radius:9px;padding:12px;resize:vertical}.hidden{display:none}.feedback{padding:12px;border-radius:9px;background:#193b4a;border:1px solid #43879e;margin:12px 0}.danger{background:#432c30;border-color:#87525c}.footer{font-size:11px;color:#8499af;margin-top:35px}.titleRow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap} @media(max-width:700px){.layout{display:block}nav{position:sticky;top:0;z-index:5;flex-direction:row;overflow:auto;padding:9px;gap:5px;border-bottom:1px solid #324960}nav button{white-space:nowrap;font-size:12px;padding:10px}main{padding:16px}.grid{grid-template-columns:1fr}.top{padding:13px}.logo{font-size:20px}.stats{gap:6px}.stat{padding:10px 5px}.stat strong{font-size:20px}}
</style></head><body><div class="shell"><header class="top"><div><div class="logo">⬡ CASEFILE</div><div class="sub">KRIMINALPOLIZEI · ERMITTLUNGSSYSTEM</div></div><span class="badge">ALPHA 0.1 · FALL 001</span></header><div class="layout"><nav id="nav"></nav><main id="screen" aria-live="polite"></main></div></div><script>
'use strict';
const KEY='casefile-alpha01-v1';
const sections=[['home','⌂ Übersicht'],['file','▤ Fallakte'],['evidence','◈ Beweise'],['people','♙ Personen'],['interview','▣ Verhöre'],['notes','✎ Notizen'],['solve','⚖ Abschluss']];
const persons=[{id:'mara',name:'Mara Keller',role:'Ehefrau, 34',description:'Daniel und Mara standen kurz vor der Trennung. Laut Mara war sie den ganzen Abend bei ihrer Schwester.',questions:[['Wo waren Sie zwischen 21:00 und 21:30 Uhr?','Bei meiner Schwester in Spiez. Ich war den ganzen Abend dort.'],['Gab es einen Streit?','Wir hatten wegen der Trennung gestritten. Aber ich wollte mich mit ihm aussprechen.'],['Haben Sie Daniel an diesem Abend angerufen?','Nein. Wir hatten seit dem Nachmittag keinen Kontakt.']],challenge:{requires:'call',title:'Telefonprotokoll vorlegen',answer:'Gut, ja, ich habe um 21:12 angerufen. Ich wollte nur wissen, ob er morgen Zeit hat. Ich habe es verheimlicht, weil es verdächtig klingt.',flag:'maraCall'},challenge2:{requires:'cell',title:'Standortdaten vorlegen',answer:'Ich war tatsächlich in der Nähe. Ich bin an der Wohnung vorbeigefahren, habe aber niemanden gesehen und bin weiter zu meiner Schwester.',flag:'maraLocation'}}, {id:'lukas',name:'Lukas Steiner',role:'Geschäftspartner, 41',description:'Daniel schuldete ihm CHF 48’000. Laut Lukas verliess er Daniel um 18 Uhr.',questions:[['Wann sahen Sie Daniel zuletzt?','Um ungefähr 18 Uhr in der Werkstatt. Danach bin ich ins Büro.'],['Was ist mit den CHF 48’000?','Die Schulden sind echt. Aber Daniel wollte mir das Geld nächste Woche zurückzahlen.'],['Kann jemand Ihr Alibi bestätigen?','Meine Bürokarte zeigt, wann ich das Gebäude betreten habe.']],challenge:{requires:'badge',title:'Zutrittsprotokoll vorlegen',answer:'Ja, mein Badge wurde um 20:52 registriert. Ich war die ganze Zeit im Büro. Fragen Sie den Sicherheitsdienst.',flag:'lukasAlibi'}}, {id:'nina',name:'Nina Roth',role:'Nachbarin, 29',description:'Wohnt auf dem gleichen Stock und alarmierte später die Polizei.',questions:[['Was haben Sie gehört?','Gegen 21:15 Uhr hörte ich eine Frau und einen Mann streiten.'],['Haben Sie jemanden gesehen?','Gegen 21:24 Uhr ging eine Person in dunkler Jacke durchs Treppenhaus. Das Gesicht konnte ich nicht erkennen.'],['Wann haben Sie die Polizei verständigt?','Um 22:06 Uhr. Zuvor hatte ich an der Tür geklopft, aber niemand antwortete.']]}];
const clues=[{id:'autopsy',title:'Gerichtsmedizin',kind:'Gutachten',text:'Daniel Keller starb durch einen einzelnen Schlag mit einem schweren Gegenstand. Todeszeitpunkt: 21:00–21:30 Uhr.'},{id:'call',title:'Telefonprotokoll',kind:'Telekommunikation',text:'Am 24.10. um 21:12 Uhr nahm Daniel einen Anruf von Mara Keller entgegen. Dauer: 48 Sekunden.'},{id:'camera',title:'Überwachungskamera',kind:'Videoauswertung',text:'Um 21:24 Uhr verliess eine Person in dunkler Jacke das Wohnhaus. Gesicht und Geschlecht sind nicht erkennbar.'},{id:'cell',title:'Funkzellenauswertung',kind:'Standortdaten',text:'Maras Mobiltelefon war um 21:18 Uhr mit einer Funkzelle in der Nähe des Tatorts verbunden. Das belegt keinen genauen Standort.'},{id:'bank',title:'Bankunterlagen',kind:'Finanzen',text:'Daniel Keller schuldete Lukas Steiner CHF 48’000. Eine Rückzahlung war für Ende Oktober angekündigt.'},{id:'badge',title:'Büro-Zutrittsprotokoll',kind:'Elektronisches Log',text:'Lukas Steiners persönliche Zutrittskarte wurde um 20:52 Uhr und 23:08 Uhr am Bürogebäude verwendet. Ob er dazwischen dort blieb, lässt sich daraus allein nicht ableiten.'},{id:'sister',title:'Aussage der Schwester',kind:'Zeugenbericht',text:'Maras Schwester bestätigt: Mara traf erst um 21:48 Uhr in Spiez ein, deutlich später als zunächst angegeben.'},{id:'lab',title:'Laborbericht zum Briefbeschwerer',kind:'Kriminaltechnik',text:'Ein schwerer Briefbeschwerer aus Daniels Wohnzimmer trägt Daniels Blut und eine eindeutig zugeordnete Fingerabdruckspur von Mara Keller. Das beweist Kontakt mit dem Gegenstand, aber für sich allein noch nicht den Zeitpunkt.'}];
const solution={person:'mara',motive:'relationship',proof:'lab'};
let state;
function fresh(){return{section:'home',seen:[],answers:{},flags:[],person:'mara',notes:'',choice:{},finished:false,result:null,started:Date.now()}}
try{state={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'null')}}catch{state=fresh()}
const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(page){state.section=page;save();render();window.scrollTo({top:0,behavior:'instant'})}
function render(){ $('nav').innerHTML=sections.map(([id,label])=>`<button class="${state.section===id?'active':''}" data-nav="${id}">${label}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.nav));const page={home:home,file:file,evidence:evidence,people:people,interview:interview,notes:notes,solve:solve}[state.section];$('screen').innerHTML=page();wire();}
function home(){return `<div class="eyebrow">Aktive Ermittlung · Tötungsdelikt</div><h1>Der letzte Anruf</h1><p class="muted">Frutigen, Kanton Bern · 24. Oktober 2026</p><div class="card"><div class="titleRow"><h3>Ermittlungsbericht</h3><span class="pill">${state.finished?'Abgeschlossen':'Ungelöst'}</span></div><p>Der 38-jährige Daniel Keller wird tot in seiner Wohnung gefunden. Drei Personen geraten in den Fokus. Welche Aussagen stimmen – und wer hat ein Motiv?</p><p>Prüfe die Fallakte, untersuche Spuren, verhöre die Beteiligten und gib deine Schlussfolgerung ab.</p></div><div class="stats"><div class="stat"><strong>3</strong><span>Personen</span></div><div class="stat"><strong>${state.seen.length}/8</strong><span>Beweise geprüft</span></div><div class="stat"><strong>${Object.values(state.answers).reduce((a,v)=>a+v.length,0)}</strong><span>Fragen gestellt</span></div></div><div class="btnrow"><button class="btn primary" data-go="file">Ermittlung beginnen →</button>${state.finished?'<button class="btn" data-go="solve">Abschluss ansehen</button>':''}</div><div class="footer">Ein fiktiver Kriminalfall · Spielstand wird lokal auf diesem Gerät gespeichert.</div>`}
function file(){return `<div class="eyebrow">Fallakte BE-2026-001</div><h2>Polizeirapport</h2><div class="card"><h3>Vorgang</h3><p>Am Samstag, 24. Oktober 2026, um 22:06 Uhr meldete die Nachbarin Nina Roth, dass Daniel Keller (38) nicht auf Klingeln oder Klopfen reagiere. Eine Polizeipatrouille und der Rettungsdienst fanden ihn in seiner Wohnung an der Bahnhofstrasse in Frutigen leblos auf.</p><div class="line"></div><h3>Erste Feststellungen</h3><p>Keine erkennbaren Einbruchspuren. Im Wohnzimmer lag ein umgestossener Stuhl. Die Ermittler vermuten eine Auseinandersetzung vor der Tat. Ein schwerer Briefbeschwerer wurde sichergestellt.</p><div class="line"></div><h3>Ermittlungsauftrag</h3><p>Stelle fest, wer für Daniels Tod verantwortlich ist. Vergleiche Aussagen mit objektiven Spuren. Ein blosses Motiv ist kein Schuldbeweis.</p></div><button class="btn primary" data-go="evidence">Beweise untersuchen →</button>`}
function evidence(){return `<div class="eyebrow">Asservatenkammer</div><h2>Beweise <span class="pill">${state.seen.length}/8 geprüft</span></h2>${clues.map(c=>`<div class="card"><span class="eyebrow">${escapeHtml(c.kind)} · B-${String(clues.indexOf(c)+1).padStart(3,'0')}</span><h3>${escapeHtml(c.title)} ${state.seen.includes(c.id)?'<span class="good">✓</span>':''}</h3>${state.seen.includes(c.id)?`<p>${escapeHtml(c.text)}</p>`:''}<button class="btn small" data-clue="${c.id}">${state.seen.includes(c.id)?'Erneut ansehen':'Beweis untersuchen'}</button></div>`).join('')}`}
function people(){return `<div class="eyebrow">Personenregister</div><h2>Beteiligte Personen</h2><div class="grid">${persons.map(p=>`<div class="card"><div class="eyebrow">${p.role}</div><h3>♙ ${p.name}</h3><p>${p.description}</p><button class="btn small" data-person="${p.id}">Person befragen →</button></div>`).join('')}</div>`}
function interview(){const p=persons.find(p=>p.id===state.person)||persons[0];return `<div class="eyebrow">Befragung · Protokoll</div><h2>Verhörraum</h2><div class="btnrow">${persons.map(x=>`<button class="btn small ${p.id===x.id?'primary':''}" data-person="${x.id}">${x.name}</button>`).join('')}</div><div class="card"><h3>♙ ${p.name}</h3><p class="muted small">${p.role}</p><div class="line"></div>${p.questions.map(([q,a],i)=>`<div style="margin-bottom:12px"><button class="btn small" data-question="${i}">${escapeHtml(q)}</button>${(state.answers[p.id]||[]).includes(i)?`<div class="statement">«${escapeHtml(a)}»</div>`:''}</div>`).join('')}${[p.challenge,p.challenge2].filter(Boolean).map(ch=>`<div class="line"></div><button class="btn small ${state.seen.includes(ch.requires)?'primary':''}" data-challenge="${ch.flag}" ${!state.seen.includes(ch.requires)?'disabled':''}>⚑ ${ch.title}${!state.seen.includes(ch.requires)?' (Beweis noch nicht geprüft)':''}</button>${state.flags.includes(ch.flag)?`<div class="statement">«${escapeHtml(ch.answer)}»</div>`:''}`).join('')}</div><p class="muted small">Hinweis: Nach der Untersuchung eines Beweises kannst du ihn im Verhör vorlegen. Achte auf Widersprüche.</p>`}
function notes(){return `<div class="eyebrow">Persönliches Notizbuch</div><h2>Ermittlungsnotizen</h2><p class="muted">Deine Theorien bleiben auf diesem Gerät gespeichert.</p><textarea id="notes" placeholder="Tatzeit, Alibis, offene Fragen, Verdächtige …">${escapeHtml(state.notes)}</textarea><p class="good" id="savedNotes">Automatisches Speichern aktiviert.</p>`}
function solve(){if(state.finished){const r=state.result;return `<div class="eyebrow">Abschlussbericht</div><h2>Fall abgeschlossen</h2><div class="card"><h3>${r.correct?'✓ Fall gelöst':'✕ Ermittlungsfehler'}</h3><p>${r.correct?'Du hast die richtige Person, das entscheidende Motiv und den wichtigsten Beweis ausgewählt.':'Deine Kombination war nicht vollständig korrekt. Vergleiche sie mit der Auflösung.'}</p><div class="line"></div><h3>Auflösung (Spoiler)</h3><p><strong>Täterin: Mara Keller.</strong> Daniel wollte sich endgültig von ihr trennen. Mara suchte ihn auf, die Situation eskalierte und sie erschlug ihn mit dem Briefbeschwerer. Danach fuhr sie zu ihrer Schwester nach Spiez und log über die Uhrzeit.</p><p>Die Telefonverbindung um 21:12 Uhr, die Funkzelle um 21:18 Uhr und das Eintreffen bei ihrer Schwester erst um 21:48 Uhr widerlegen ihr ursprüngliches Alibi. Der Fingerabdruck auf dem blutigen Briefbeschwerer ist die wichtigste Sachspur. Zusammen mit der rekonstruierten Zeitlinie ergibt sich in dieser <em>fiktiven</em> Fallgeschichte das Gesamtbild.</p><p>Lukas hat ein finanzielles Motiv, aber keine Tatspur. Nina ist die wichtigste Zeugin, nicht die Täterin.</p><div class="feedback">Deine Auswahl: ${escapeHtml(r.person)} · ${escapeHtml(r.motive)} · ${escapeHtml(r.proof)}</div></div><button class="btn" id="reset">↻ Neuen Durchlauf starten</button>`}
return `<div class="eyebrow">Ermittlungsabschluss</div><h2>Dein Abschlussbericht</h2><div class="card"><p>Entscheide dich für eine Person, das wahrscheinlichste Motiv und den wichtigsten Beweis. Danach wird die Lösung enthüllt.</p><div class="line"></div><h3>1 · Wer war es?</h3>${persons.map(p=>opt('person',p.id,p.name)).join('')}<div class="line"></div><h3>2 · Was war das Motiv?</h3>${[['relationship','Trennung und eskalierter Beziehungskonflikt'],['money','CHF 48’000 Geschäftsschulden'],['neighbor','Nachbarschaftsstreit']].map(x=>opt('motive',...x)).join('')}<div class="line"></div><h3>3 · Welcher Beweis ist am wichtigsten?</h3>${[['lab','Blutiger Briefbeschwerer mit Fingerabdruck'],['bank','Bankunterlagen zur Geldschuld'],['camera','Unscharfes Bild der dunklen Jacke']].map(x=>opt('proof',...x)).join('')}<div class="btnrow"><button class="btn primary" id="finish" ${!['person','motive','proof'].every(k=>state.choice[k])?'disabled':''}>Fall abschliessen und Lösung sehen</button></div><p class="muted small">Achtung: Nach Abschluss siehst du die Täterauflösung.</p></div>`}
function opt(field,value,label){return `<label class="choice"><input type="radio" name="${field}" value="${value}" ${state.choice[field]===value?'checked':''}>${escapeHtml(label)}</label>`}
function wire(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-clue]').forEach(b=>b.onclick=()=>{if(!state.seen.includes(b.dataset.clue))state.seen.push(b.dataset.clue);save();render()});document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{state.person=b.dataset.person;go('interview')});document.querySelectorAll('[data-question]').forEach(b=>b.onclick=()=>{let v=state.answers[state.person]||[];let q=Number(b.dataset.question);if(!v.includes(q))v.push(q);state.answers[state.person]=v;save();render()});document.querySelectorAll('[data-challenge]').forEach(b=>b.onclick=()=>{if(!state.flags.includes(b.dataset.challenge))state.flags.push(b.dataset.challenge);save();render()});if($('notes'))$('notes').oninput=e=>{state.notes=e.target.value;save()};document.querySelectorAll('input[type=radio]').forEach(el=>el.onchange=()=>{state.choice[el.name]=el.value;save();const finish=$('finish');if(finish)finish.disabled=!['person','motive','proof'].every(k=>state.choice[k])});if($('finish'))$('finish').onclick=()=>{if(!['person','motive','proof'].every(k=>state.choice[k]))return;const labels={person:{mara:'Mara Keller',lukas:'Lukas Steiner',nina:'Nina Roth'},motive:{relationship:'Beziehungskonflikt',money:'Geschäftsschulden',neighbor:'Nachbarschaftsstreit'},proof:{lab:'Briefbeschwerer',bank:'Bankunterlagen',camera:'Kamerabild'}};state.result={correct:Object.keys(solution).every(k=>state.choice[k]===solution[k]),...Object.fromEntries(Object.keys(solution).map(k=>[k,labels[k][state.choice[k]]]))};state.finished=true;save();render();window.scrollTo(0,0)};if($('reset'))$('reset').onclick=()=>{if(confirm('Gesamten Spielstand löschen und Fall neu starten?')){state=fresh();save();go('home')}}}
render();
</script></body></html>
